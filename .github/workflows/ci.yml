# -----------------------------------------------------------------------------
# Cullendula CI
#
# Runs the very same verification that is run locally:
# ./localPipeline.sh --noRun performs configure+build, CTest, the coverage build
# with its 95% line-coverage gate, Doxygen with an empty-warning-log gate,
# Cppcheck, and clang-format. --noRun suppresses the final interactive app
# launch, which is exactly what that option was added for.
#
# Every dependency this workflow can pin is pinned to an exact release, matching
# the expected versions declared in CMakeLists.txt and documented in README.md.
# -----------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep these in sync with CULLENDULA_EXPECTED_*_VERSION in CMakeLists.txt.
  CULLENDULA_EXPECTED_CMAKE_VERSION: 4.4.3
  CULLENDULA_EXPECTED_CMAKE_SHA256: d6c83076c575bc00b823522ac974bda66d0af05d6ddc30e739c12385cf32c6cc
  CULLENDULA_EXPECTED_CMAKE_SHA256_WINDOWS: 4d52ebab7193a698651639ed80d8d04fd903358843572cf44c7fd234cb7c26ab
  CULLENDULA_EXPECTED_QT_VERSION: 6.11.2
  CULLENDULA_EXPECTED_GCOVR_VERSION: 8.6

jobs:
  local-pipeline:
    name: Local pipeline (Linux, Qt 6.11.2)
    runs-on: ubuntu-24.04

    env:
      # The test binary already falls back to the offscreen platform plugin, but
      # the GUI smoke test and any Qt tool started here must stay headless too.
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Install build and quality tooling
        # Distribution packages: their exact release is fixed by the runner
        # image. They are reported below so a report difference can be traced.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential \
            clang-format \
            cppcheck \
            python3-pygments \
            doxygen \
            graphviz \
            libgl1-mesa-dev \
            libegl1 \
            libdbus-1-3 \
            libfontconfig1 \
            libfreetype6 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1

      - name: Install the pinned CMake
        run: |
          set -euo pipefail
          archive="cmake-${CULLENDULA_EXPECTED_CMAKE_VERSION}-linux-x86_64.tar.gz"
          curl -fsSLo "${RUNNER_TEMP}/${archive}" \
            "https://github.com/Kitware/CMake/releases/download/v${CULLENDULA_EXPECTED_CMAKE_VERSION}/${archive}"
          echo "${CULLENDULA_EXPECTED_CMAKE_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/cmake-${CULLENDULA_EXPECTED_CMAKE_VERSION}-linux-x86_64/bin" >> "${GITHUB_PATH}"

      - name: Install the pinned Qt
        uses: jurplel/install-qt-action@v4.4.0
        with:
          version: ${{ env.CULLENDULA_EXPECTED_QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          # qtbase covers Core/Gui/Widgets/Test and qttools provides the
          # LinguistTools package that qt_add_translations() requires.
          # qtdeclarative is needed even though this application ships no QML:
          # the lrelease binary from qttools links against libQt6Qml.so.6 and
          # cannot start without it. icu is a separate archive that qtbase links
          # against on Linux, so leaving it out breaks the Qt tools as well.
          archives: qtbase qttools qtdeclarative qtsvg icu
          # The Extensions menu is built from the image formats Qt actually
          # supports at run time, so the plugins decide the product behaviour and
          # not just the build. qtbase alone has no webp, tiff or svg reader,
          # which makes the menu differ from a normal desktop installation.
          modules: qtimageformats
          cache: true

      - name: Install the pinned gcovr
        run: |
          pipx install "gcovr==${CULLENDULA_EXPECTED_GCOVR_VERSION}"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Verify the pinned versions and report the rest
        run: |
          set -euo pipefail
          cmake --version | head -1
          gcovr --version | head -1
          cmake --version | head -1 | grep -Fq "cmake version ${CULLENDULA_EXPECTED_CMAKE_VERSION}"
          gcovr --version | head -1 | grep -Fq "gcovr ${CULLENDULA_EXPECTED_GCOVR_VERSION}"
          # Qt itself is verified by CMake: find_package(... EXACT) fails the
          # configure step when the installed Qt is not the expected release.
          g++ --version | head -1
          gcov --version | head -1
          doxygen --version
          cppcheck --version
          clang-format --version

      - name: Run the local pipeline
        run: ./localPipeline.sh --noRun --verbose

      - name: Upload generated reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cullendula-reports
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/doxygen/html
            build/doxygen/warnings.txt
            build-coverage/coverage
            reports/cppcheck

  windows-tests:
    name: Unit tests (Windows, Qt 6.11.2)
    runs-on: windows-2022
    # A Qt fatal error appears as a modal dialog on Windows and nothing dismisses it on a
    # runner, so the job is capped instead of blocking until the account limit.
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Install the pinned CMake
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = "cmake-$env:CULLENDULA_EXPECTED_CMAKE_VERSION-windows-x86_64.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP $archive
          Invoke-WebRequest -Uri "https://github.com/Kitware/CMake/releases/download/v$env:CULLENDULA_EXPECTED_CMAKE_VERSION/$archive" -OutFile $archivePath -UseBasicParsing
          $actualHash = (Get-FileHash -Algorithm SHA256 $archivePath).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:CULLENDULA_EXPECTED_CMAKE_SHA256_WINDOWS) {
            throw "CMake archive checksum mismatch: expected $env:CULLENDULA_EXPECTED_CMAKE_SHA256_WINDOWS, got $actualHash"
          }
          Expand-Archive -Path $archivePath -DestinationPath $env:RUNNER_TEMP
          $cmakeRoot = Join-Path $env:RUNNER_TEMP "cmake-$env:CULLENDULA_EXPECTED_CMAKE_VERSION-windows-x86_64"
          "$cmakeRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install the pinned Qt from the official archives
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Same reason as in release.yml: install-qt-action drives aqtinstall, which looks
          # for a Windows path that does not exist on the Qt server, so the official
          # archives are fetched directly to keep the exactly pinned Qt version.
          $base = "https://download.qt.io/online/qtsdkrepository/windows_x86/desktop/qt6_6112/qt6_6112_msvc2022_64"
          $packages = [ordered]@{
            "qt.qt6.6112.win64_msvc2022_64" = @("qtbase", "qttools", "qtdeclarative", "qtsvg", "qttranslations", "d3dcompiler_47", "opengl32sw")
            "qt.qt6.6112.addons.qtimageformats.win64_msvc2022_64" = @("qtimageformats")
          }
          New-Item -ItemType Directory -Force -Path qt-win | Out-Null
          foreach ($package in $packages.Keys) {
            $listing = (Invoke-WebRequest -Uri "$base/$package/" -UseBasicParsing).Content
            $links = [regex]::Matches($listing, 'href="([^"]+\.7z)"') | ForEach-Object { $_.Groups[1].Value }
            foreach ($component in $packages[$package]) {
              $file = $links |
                Where-Object { $_ -like "*$component*" -and $_ -notmatch 'debug|doc|example' } |
                Select-Object -First 1
              if (-not $file) { throw "no archive found for '$component' in $package" }
              Write-Host "downloading $file"
              Invoke-WebRequest -Uri "$base/$package/$file" -OutFile "$component.7z" -UseBasicParsing
              & 7z x -y "$component.7z" -oqt-win | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "extracting $component failed" }
            }
          }
          $qt = (Resolve-Path qt-win).Path
          if (-not (Test-Path "$qt\lib\cmake\Qt6\Qt6Config.cmake")) { throw "Qt6Config.cmake missing from the extracted Qt" }
          # The tests link against the Qt DLLs, so the Qt bin directory has to be on PATH.
          "QT_ROOT_DIR=$qt" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CMAKE_PREFIX_PATH=$qt" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$qt\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Configure and build
        run: |
          cmake -S . -B build -DCULLENDULA_BUILD_TESTS=ON
          cmake --build build --config Release --parallel

      - name: Run the tests
        env:
          QT_QPA_PLATFORM: offscreen
        # This executable writes nothing to the console on Windows, so a bare exit code
        # would say nothing about what broke. CULLENDULA_TEST_REPORT_DIR makes each test
        # object write its own report, which is the only way to see the results here.
        run: |
          $test = Get-ChildItem -Recurse -Filter CullendulaTests.exe build |
                  Select-Object -First 1 -ExpandProperty FullName
          Write-Host "running $test"
          $env:CULLENDULA_TEST_REPORT_DIR = "$PWD\test-reports"
          New-Item -ItemType Directory -Force -Path $env:CULLENDULA_TEST_REPORT_DIR | Out-Null
          & $test
          $failed = $LASTEXITCODE
          Write-Host "unit test exit code: $failed"
          Get-ChildItem $env:CULLENDULA_TEST_REPORT_DIR -Filter *.txt | ForEach-Object {
            Write-Host "----- $($_.Name) -----"
            Get-Content $_.FullName
          }
          ctest --test-dir build -C Release -R CullendulaMainSmokeTest --output-on-failure
          if ($failed -ne 0) { throw "the unit suite reported failures (status $failed)" }
