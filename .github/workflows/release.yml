# -----------------------------------------------------------------------------
# Cullendula release
#
# Triggered by pushing a version tag, for example:
#
#     git tag v0.7.0 && git push origin v0.7.0
#
# Nothing is published that has not been verified: the tag has to agree with the
# version in CMakeLists.txt, the Linux job runs the project's full quality gate,
# and both packages are started once before the release is created.
#
# Artifacts:
#   * Cullendula-<version>-x86_64.AppImage   - Linux, bundles Qt, just run it
#   * Cullendula-<version>-windows-x64.zip   - Windows 11 x64, unpack and run
#   * cullendula-<tag>-doxygen-html.tar.gz   - generated API documentation
# -----------------------------------------------------------------------------
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep these in sync with CULLENDULA_EXPECTED_*_VERSION in CMakeLists.txt.
  CULLENDULA_EXPECTED_CMAKE_VERSION: 4.4.2
  CULLENDULA_EXPECTED_QT_VERSION: 6.11.1
  CULLENDULA_EXPECTED_GCOVR_VERSION: 8.6
  # Newest non-prerelease tags; linuxdeploy's "continuous" tag is a moving target.
  LINUXDEPLOY_VERSION: 1-alpha-20251107-1
  LINUXDEPLOY_PLUGIN_QT_VERSION: 1-alpha-20250213-1

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Check that the tag matches the project version
        id: version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(sed -n 's/^[[:space:]]*VERSION[[:space:]]\+\([0-9.]\+\)[[:space:]]*$/\1/p' CMakeLists.txt | head -1)"
          echo "tag: ${tag_version}, CMakeLists.txt: ${project_version}"
          if [[ "${tag_version}" != "${project_version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the project version ${project_version} in CMakeLists.txt."
            exit 1
          fi
          if ! grep -q "^\* v${project_version} " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for v${project_version}."
            exit 1
          fi
          echo "version=${tag_version}" >> "${GITHUB_OUTPUT}"

  linux:
    name: Linux AppImage
    needs: verify
    runs-on: ubuntu-24.04

    env:
      QT_QPA_PLATFORM: offscreen
      CULLENDULA_VERSION: ${{ needs.verify.outputs.version }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Install build and quality tooling
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential clang-format cppcheck python3-pygments doxygen graphviz \
            libgl1-mesa-dev libegl1 libdbus-1-3 libfontconfig1 libfreetype6 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1

      - name: Install the pinned CMake
        uses: lukka/get-cmake@v4.4.2
        with:
          cmakeVersion: ${{ env.CULLENDULA_EXPECTED_CMAKE_VERSION }}

      - name: Install the pinned Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.CULLENDULA_EXPECTED_QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          archives: qtbase qttools qtdeclarative qtsvg icu
          modules: qtimageformats
          cache: true

      - name: Install the pinned gcovr
        run: |
          pipx install "gcovr==${CULLENDULA_EXPECTED_GCOVR_VERSION}"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Run the local pipeline
        run: ./localPipeline.sh --noRun --verbose

      - name: Package the generated API documentation
        run: tar -czf "cullendula-${GITHUB_REF_NAME}-doxygen-html.tar.gz" -C build/doxygen html

      - name: Install into an AppDir
        run: cmake --install build --prefix AppDir/usr

      - name: Fetch the pinned AppImage tooling
        run: |
          set -euo pipefail
          curl -sSLo linuxdeploy.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_VERSION}/linuxdeploy-x86_64.AppImage"
          curl -sSLo linuxdeploy-plugin-qt.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/${LINUXDEPLOY_PLUGIN_QT_VERSION}/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-qt.AppImage

      - name: Drop Qt image plugins whose dependencies the build image cannot satisfy
        run: |
          set -euo pipefail
          # The official Qt binaries are built on RHEL 9, so some image format plugins
          # link against sonames Ubuntu does not carry, for example libtiff.so.5 against
          # Ubuntu's libtiff.so.6. linuxdeploy aborts when it cannot resolve a dependency,
          # so drop exactly those instead of failing the release. The Extensions menu is
          # built from the formats Qt reports at run time, so a dropped plugin simply does
          # not appear there.
          for plugin in "${QT_ROOT_DIR}"/plugins/imageformats/*.so; do
            missing="$(ldd "${plugin}" 2>/dev/null | awk '/not found/ {printf "%s ", $1}')"
            if [ -n "${missing}" ]; then
              echo "dropping $(basename "${plugin}") - unresolvable: ${missing}"
              rm -f "${plugin}"
            fi
          done
          echo "remaining: $(ls "${QT_ROOT_DIR}"/plugins/imageformats/ | tr '\n' ' ')"
          # webp is a documented feature of the Extensions menu, so it must survive.
          test -f "${QT_ROOT_DIR}/plugins/imageformats/libqwebp.so"

      - name: Build the AppImage
        env:
          # Runners have no FUSE, so the tools have to unpack themselves instead.
          APPIMAGE_EXTRACT_AND_RUN: 1
          # The strip bundled in linuxdeploy cannot read the newer .relr.dyn relocation
          # sections current system libraries use, and aborts when it meets one.
          NO_STRIP: 1
          # linuxdeploy deploys only the xcb platform plugin. offscreen is needed so the
          # package can be started without a display, which is how it is tested below.
          EXTRA_PLATFORM_PLUGINS: libqoffscreen.so
        run: |
          set -euo pipefail
          export QMAKE="${QT_ROOT_DIR}/bin/qmake"
          test -x "${QMAKE}" || export QMAKE="$(command -v qmake6)"
          export OUTPUT="Cullendula-${CULLENDULA_VERSION}-x86_64.AppImage"
          ./linuxdeploy.AppImage \
            --appdir AppDir \
            --plugin qt \
            --output appimage \
            --desktop-file AppDir/usr/share/applications/it.marcelpetrick.Cullendula.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/32x32/apps/it.marcelpetrick.Cullendula.png
          ls -la "${OUTPUT}"

      - name: Smoke-test the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          set -euo pipefail
          appimage="Cullendula-${CULLENDULA_VERSION}-x86_64.AppImage"
          chmod +x "${appimage}"
          # QT_PLUGIN_PATH and QT_ROOT_DIR are removed for this run. install-qt-action
          # exports them, and with them set the package loads the runner's Qt plugins
          # instead of its own, which would make this test pass for a package that fails
          # on a user's machine.
          env -u QT_PLUGIN_PATH -u QT_ROOT_DIR -u LD_LIBRARY_PATH \
            QT_QPA_PLATFORM=offscreen CULLENDULA_EXIT_AFTER_STARTUP_MS=0 "./${appimage}"
          echo "the packaged application starts and exits cleanly on its own plugins"

          "./${appimage}" --appimage-extract >/dev/null
          echo "bundled platforms:     $(ls squashfs-root/usr/plugins/platforms/ | tr '\n' ' ')"
          echo "bundled image formats: $(ls squashfs-root/usr/plugins/imageformats/ | tr '\n' ' ')"
          test -f squashfs-root/usr/plugins/platforms/libqxcb.so
          test -f squashfs-root/usr/plugins/platforms/libqoffscreen.so
          rm -rf squashfs-root

      - name: Upload the Linux artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-artifacts
          if-no-files-found: error
          path: |
            Cullendula-${{ needs.verify.outputs.version }}-x86_64.AppImage
            cullendula-${{ github.ref_name }}-doxygen-html.tar.gz

  windows:
    name: Windows package
    needs: verify
    runs-on: windows-2022
    # A Qt fatal error appears as a modal dialog on Windows, and nothing dismisses it
    # on a runner, so any mistake here blocks until the job limit unless it is capped.
    timeout-minutes: 30

    env:
      CULLENDULA_VERSION: ${{ needs.verify.outputs.version }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Install the pinned CMake
        uses: lukka/get-cmake@v4.4.2
        with:
          cmakeVersion: ${{ env.CULLENDULA_EXPECTED_CMAKE_VERSION }}

      - name: Install the pinned Qt from the official archives
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # install-qt-action cannot be used here. It drives aqtinstall, and 3.3.0, the
          # newest release, looks for .../qt6_6111/qt6_6111/Updates.xml on Windows, which
          # is a 404: Qt publishes the Windows packages under an architecture-suffixed
          # folder (qt6_6111_msvc2022_64). The official archives are fetched directly
          # instead, which keeps the exactly pinned Qt version.
          $base = "https://download.qt.io/online/qtsdkrepository/windows_x86/desktop/qt6_6111/qt6_6111_msvc2022_64"
          $packages = [ordered]@{
            "qt.qt6.6111.win64_msvc2022_64" = @("qtbase", "qttools", "qtdeclarative", "qtsvg", "qttranslations", "d3dcompiler_47", "opengl32sw")
            "qt.qt6.6111.addons.qtimageformats.win64_msvc2022_64" = @("qtimageformats")
          }
          New-Item -ItemType Directory -Force -Path qt-win | Out-Null
          foreach ($package in $packages.Keys) {
            $listing = (Invoke-WebRequest -Uri "$base/$package/" -UseBasicParsing).Content
            $links = [regex]::Matches($listing, 'href="([^"]+\.7z)"') | ForEach-Object { $_.Groups[1].Value }
            foreach ($component in $packages[$package]) {
              $file = $links |
                Where-Object { $_ -like "*$component*" -and $_ -notmatch 'debug|doc|example' } |
                Select-Object -First 1
              if (-not $file) { throw "no archive found for '$component' in $package" }
              Write-Host "downloading $file"
              Invoke-WebRequest -Uri "$base/$package/$file" -OutFile "$component.7z" -UseBasicParsing
              & 7z x -y "$component.7z" -oqt-win | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "extracting $component failed" }
            }
          }
          $qt = (Resolve-Path qt-win).Path
          if (-not (Test-Path "$qt\bin\windeployqt.exe")) { throw "windeployqt.exe missing from the extracted Qt" }
          if (-not (Test-Path "$qt\lib\cmake\Qt6\Qt6Config.cmake")) { throw "Qt6Config.cmake missing from the extracted Qt" }
          # The tests link against the Qt DLLs, so the Qt bin directory has to be on PATH.
          "QT_ROOT_DIR=$qt" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CMAKE_PREFIX_PATH=$qt" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$qt\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Configure and build
        run: |
          cmake -S . -B build -DCULLENDULA_BUILD_TESTS=ON
          cmake --build build --config Release --parallel

      - name: Run the tests
        env:
          QT_QPA_PLATFORM: offscreen
        # The whole suite passes on Windows since the path handling was fixed, so it
        # gates the package like it gates the Linux build. The reports are printed
        # afterwards either way, because this executable writes nothing to the console
        # here and a bare exit code would say nothing about what broke.
        run: |
          $test = Get-ChildItem -Recurse -Filter CullendulaTests.exe build |
                  Select-Object -First 1 -ExpandProperty FullName
          Write-Host "running $test"
          # This executable writes nothing to the console on Windows, so redirecting it
          # captured an empty file. CULLENDULA_TEST_REPORT_DIR makes each test object
          # write its own report instead, which is the only way to see the results here:
          # a single -o file would be truncated by each object in turn.
          $env:CULLENDULA_TEST_REPORT_DIR = "$PWD\test-reports"
          New-Item -ItemType Directory -Force -Path $env:CULLENDULA_TEST_REPORT_DIR | Out-Null
          & $test
          Write-Host "unit test exit code: $LASTEXITCODE"
          $failed = $LASTEXITCODE
          Get-ChildItem $env:CULLENDULA_TEST_REPORT_DIR -Filter *.txt | ForEach-Object {
            Write-Host "----- $($_.Name) -----"
            Get-Content $_.FullName
          }
          ctest --test-dir build -C Release -R CullendulaMainSmokeTest --output-on-failure
          if ($failed -ne 0) { throw "the unit suite reported failures (status $failed)" }

      - name: Assemble the portable package
        run: |
          cmake --install build --config Release --prefix staging
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item staging/bin/Cullendula.exe dist/
          Copy-Item LICENSE dist/
          Copy-Item README.md dist/
          Copy-Item CHANGELOG.md dist/
          # windeployqt copies the Qt runtime, the platform and image format plugins and
          # the MSVC runtime next to the executable, which makes the folder self-contained.
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --compiler-runtime dist/Cullendula.exe
          # windeployqt deploys the windows platform plugin only. The smoke test below
          # runs offscreen, and a missing platform plugin is a fatal Qt error, which on
          # Windows means a modal dialog that hangs the job instead of an exit code.
          Copy-Item "$env:QT_ROOT_DIR\plugins\platforms\qoffscreen.dll" dist/platforms/
          if (-not (Test-Path dist/platforms/qwindows.dll))  { throw "qwindows.dll was not deployed" }
          if (-not (Test-Path dist/platforms/qoffscreen.dll)) { throw "qoffscreen.dll was not deployed" }
          Get-ChildItem -Recurse dist | Select-Object -ExpandProperty FullName

      - name: Smoke-test the package
        env:
          QT_QPA_PLATFORM: offscreen
          CULLENDULA_EXIT_AFTER_STARTUP_MS: 0
        run: |
          # Run from inside the package folder so only the DLLs shipped with it are used.
          # Cullendula is a WIN32_EXECUTABLE, so PowerShell does not wait for it and never
          # sets $LASTEXITCODE. Start-Process -Wait -PassThru does wait and reports the
          # real exit code.
          $dist = (Resolve-Path dist).Path
          $proc = Start-Process -FilePath "$dist\Cullendula.exe" -WorkingDirectory $dist -PassThru
          # Bounded wait: a Qt startup failure shows a modal dialog that never closes on
          # a runner, so waiting without a limit would block the job for hours.
          if (-not $proc.WaitForExit(60000)) {
            $proc.Kill()
            throw "the packaged application did not exit within 60s - it is most likely blocked on a startup error dialog"
          }
          if ($proc.ExitCode -ne 0) { throw "the packaged application failed to start (exit $($proc.ExitCode))" }
          Write-Host "the packaged application starts and exits cleanly (exit $($proc.ExitCode))"

      - name: Create the zip
        run: Compress-Archive -Path dist/* -DestinationPath "Cullendula-$env:CULLENDULA_VERSION-windows-x64.zip"

      - name: Upload the Windows artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-artifacts
          if-no-files-found: error
          path: Cullendula-${{ needs.verify.outputs.version }}-windows-x64.zip

  publish:
    name: Publish the release
    needs: [verify, linux, windows]
    runs-on: ubuntu-24.04

    env:
      CULLENDULA_VERSION: ${{ needs.verify.outputs.version }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Download the built packages
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Build the release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          {
            printf '%s\n\n' "$(grep "^\* v${CULLENDULA_VERSION} " CHANGELOG.md | sed "s/^\* v${CULLENDULA_VERSION} //")"
            printf '## Downloads\n\n'
            printf '* **Linux (x86-64):** `Cullendula-%s-x86_64.AppImage` - make it executable with `chmod +x` and run it. It bundles Qt %s, so nothing else has to be installed.\n' \
              "${CULLENDULA_VERSION}" "${CULLENDULA_EXPECTED_QT_VERSION}"
            printf '* **Windows 11 (x64):** `Cullendula-%s-windows-x64.zip` - unpack it anywhere and run `Cullendula.exe`. The Qt runtime and the MSVC runtime are included.\n' \
              "${CULLENDULA_VERSION}"
            printf '* **API documentation:** `cullendula-%s-doxygen-html.tar.gz`\n\n' "${GITHUB_REF_NAME}"
            printf 'Both packages were started once by the release workflow before publishing. '
            printf 'The Linux build additionally passed the full project pipeline: unit tests, the 90%% line-coverage gate, an empty Doxygen warning log, Cppcheck and clang-format.\n\n'
            printf 'To build from source you need exactly Qt %s and CMake %s; see the README for the full expected toolchain.\n\n' \
              "${CULLENDULA_EXPECTED_QT_VERSION}" "${CULLENDULA_EXPECTED_CMAKE_VERSION}"
            printf 'The full history is in [CHANGELOG.md](https://github.com/%s/blob/master/CHANGELOG.md).\n' "${GITHUB_REPOSITORY}"
          } > release-notes.md
          cat release-notes.md
          ls -la artifacts

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "Cullendula ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag \
            artifacts/*
